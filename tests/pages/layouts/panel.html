<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layout panel (attribute) · test</title>
  <!-- layout="panel" without a theme: the kit adds layouts/panel.css; the header, the navigation and the timetable summary form one bar. -->
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <script src="../course.js"></script>
  <script>
    window.UC_COURSE.schedule = [
      { type: "lecture", class: "T1", day: 2, start: "14:00", end: "15:00", room: "FC4 0.41" },
      { type: "lecture", class: "T1", day: 4, start: "14:00", end: "15:00", room: "FC4 0.41" },
      { type: "lecture", class: "T2", day: 2, start: "15:00", end: "16:00", room: "FC6 0.29" },
      { type: "lab", class: "PL1", day: 5, start: "16:00", end: "18:00", room: "FC6 1.57" },
    ];
    window.UC_COURSE.team = window.UC_COURSE.team.map((member) => member.role === "coordinator" ? { ...member, officeHours: [{ day: 2, start: "16:00", end: "18:00" }] } : member);
  </script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="check.js" defer></script>
</head>
<body>
  <uc-page layout="panel" current="home">
    <uc-hero></uc-hero>
    <uc-notices></uc-notices>
    <section class="uc-section" aria-labelledby="checks">
      <h2 id="checks">Verificações</h2>
      <ol id="results"></ol>
    </section>
  </uc-page>
  <script>
    document.addEventListener("DOMContentLoaded", () => layoutTests((test, equal) => {
      const page = document.querySelector("uc-page");
      const wide = !matchMedia("(max-width: 960px)").matches;
      const sheets = () => Array.from(document.querySelectorAll("link[rel~=stylesheet]"), (link) => link.getAttribute("href").replace(/^.*kit\/v1\//, ""));
      const style = (selector) => getComputedStyle(page.querySelector(selector));
      const text = (selector) => Array.from(page.querySelectorAll(selector), (node) => node.textContent.replace(/\s+/g, " ").trim());
      test("the layout comes from the attribute", () => equal(UC.internal.layouts.resolve(page), "panel"));
      test("its class", () => equal(Array.from(page.classList).filter((name) => name.startsWith("uc-page--")), ["uc-page--panel"]));
      test("its style sheet is added after the kit", () => equal(sheets(), ["uc-kit.css", "layouts/panel.css"]));
      test("no header above the shell: the bar holds the header, the navigation and the summary", () =>
        equal(
          [Array.from(page.children, (node) => node.className), Array.from(page.querySelector(".uc-shell").children, (node) => node.className), Array.from(page.querySelector(".uc-panel").children, (node) => node.className)],
          [["uc-skip-link", "uc-shell", "uc-footer"], ["uc-panel", "uc-main"], ["uc-header uc-panel__brand", "uc-sidebar", "uc-panel__info"]],
        ));
      test("one header, one navigation, one h1, skip link to main", () =>
        equal([page.querySelectorAll("header").length, page.querySelectorAll("nav").length, page.querySelectorAll("h1").length, page.querySelector(".uc-skip-link").getAttribute("href")], [1, 1, 1, "#uc-main"]));
      test("lectures grouped by time and room, then the coordinator's office hours", () =>
        equal([text(".uc-panel__label"), text(".uc-panel__list li").map((line) => line.replace(/terça-feira|quinta-feira/g, ""))], [
          ["Teóricas", "Atendimento"],
          ["3.ª e 5.ª · 14:00–15:00 · FC4 0.41", "3.ª · 15:00–16:00 · FC6 0.29", "3.ª · 16:00–18:00 · Gab. 1.25"],
        ]));
      test("weekdays in full for screen readers", () => equal(text(".uc-panel__info > ul:first-of-type > li:first-child .uc-day .uc-visually-hidden"), ["terça-feira", "quinta-feira"]));
      if (wide) {
        test("a full-height bar that stays in place", () => {
          const panel = style(".uc-panel");
          equal([panel.position, panel.top, Math.round(page.querySelector(".uc-panel").getBoundingClientRect().height) === innerHeight, panel.flexDirection], ["sticky", "0px", true, "column"]);
        });
        test("the header is a column in the bar, the menu button hidden", () => equal([style(".uc-header__inner").flexDirection, style(".uc-nav-toggle").display, style(".uc-nav").display], ["column", "none", "block"]));
        test("the summary at the bottom of the bar", () => {
          const panel = page.querySelector(".uc-panel").getBoundingClientRect();
          const info = page.querySelector(".uc-panel__info").getBoundingClientRect();
          equal(Math.round(panel.bottom - info.bottom) <= 24, true);
        });
        test("the content next to the bar", () => equal(Math.round(page.querySelector(".uc-main").getBoundingClientRect().left) >= 272, true));
      } else {
        test("as sidebar: the header across the top, then Menu", () => {
          const header = page.querySelector(".uc-header").getBoundingClientRect();
          equal([style(".uc-panel").display, Math.round(header.left), Math.round(header.width) === document.documentElement.clientWidth, style(".uc-nav-toggle").display], ["contents", 0, true, "flex"]);
        });
        test("no summary", () => equal(style(".uc-panel__info").display, "none"));
        test("the button opens the list", () => {
          page.querySelector(".uc-nav-toggle").click();
          const open = style(".uc-nav").display;
          page.querySelector(".uc-nav-toggle").click();
          equal(open, "block");
        });
      }
    }));
  </script>
</body>
</html>
