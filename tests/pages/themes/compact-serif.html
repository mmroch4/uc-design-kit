<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>themes compact + serif (course.js) · test</title>
  <!-- Ready-made themes from course.js (docs/api.md 8.1): two at once, added by the kit after uc-kit.css. -->
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <script src="../course.js"></script>
  <script>window.UC_COURSE.theme = ["compact", "serif"];</script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
</head>
<body>
  <uc-page current="weeks">
    <uc-hero></uc-hero>
    <uc-this-week></uc-this-week>
    <uc-deadlines view="table" filter="all" limit="3"></uc-deadlines>
    <uc-notices></uc-notices>
    <section class="uc-section" aria-labelledby="blocks">
      <h2 id="blocks">Blocos</h2>
      <div class="uc-callout"><p>Um aviso com <a href="#blocks">uma ligação</a> e <code>código</code>.</p></div>
      <p><span class="uc-tag">etiqueta</span> <span class="uc-tag uc-tag--warning">aviso</span> <span class="uc-tag uc-tag--success">feito</span></p>
      <pre><code>int[] v = new int[10];</code></pre>
    </section>
  </uc-page>
</body>
</html>
