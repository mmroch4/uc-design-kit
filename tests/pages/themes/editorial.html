<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>theme editorial · test</title>
  <!-- The theme is named in course.js only: it brings --uc-layout: centered and @imports layouts/centered.css. -->
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <script src="../course.js"></script>
  <script>window.UC_COURSE.theme = "editorial";</script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../layouts/check.js" defer></script>
</head>
<body>
  <uc-page current="home">
    <uc-hero></uc-hero>
    <uc-this-week></uc-this-week>
    <div class="uc-split">
      <uc-notices></uc-notices>
      <uc-deadlines filter="all" limit="3"></uc-deadlines>
    </div>
    <uc-team></uc-team>
    <section class="uc-section" aria-labelledby="checks">
      <h2 id="checks">Verificações</h2>
      <ol id="results"></ol>
    </section>
  </uc-page>
  <script>
    document.addEventListener("DOMContentLoaded", () => layoutTests((test, equal) => {
      const page = document.querySelector("uc-page");
      const sheets = () => Array.from(document.querySelectorAll("link[rel~=stylesheet]"), (link) => link.getAttribute("href").replace(/^.*kit\/v1\//, ""));
      const root = getComputedStyle(document.documentElement);
      test("the layout comes from the theme's CSS", () => equal([UC.internal.themeValue("layout"), UC.internal.layouts.resolve(page)], ["centered", "centered"]));
      test("layouts/centered.css arrives by @import only", () => equal([sheets(), root.getPropertyValue("--uc-layout-centered-loaded").trim()], [["uc-kit.css", "themes/editorial.css"], "1"]));
      test("serif text, line spacing 1.7", () => equal([root.getPropertyValue("--uc-font-sans").trim().startsWith("Charter"), root.getPropertyValue("--uc-line-height").trim()], [true, "1.7"]));
      test("choices for later phases", () => equal([UC.internal.themeValue("hero-align"), UC.internal.themeValue("team-view")], ["center", "table"]));
      test("the hero is centred; its title is for screen readers only", () => {
        const title = page.querySelector(".uc-hero__title");
        equal([getComputedStyle(page.querySelector("uc-hero")).textAlign, title.getBoundingClientRect().width <= 1, page.querySelectorAll("h1").length], ["center", true, 1]);
      });
    }));
  </script>
</body>
</html>
