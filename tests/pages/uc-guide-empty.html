<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-guide (no exercises, no-toc) · test</title>
  <link rel="stylesheet" href="../../kit/v1/uc-kit.css">
  <script src="course.js"></script>
  <script src="../../kit/v1/uc-kit.js" defer></script>
</head>
<body>
  <uc-page current="weeks">
    <uc-guide no-toc>
      <h1>Guia sem exercícios</h1>
      <section class="uc-section">
        <h2>Leitura</h2>
        <p>Este guia não tem exercícios, nem índice (<code>no-toc</code>), nem semana: o indicador de progresso fica escondido e o conteúdo ocupa toda a largura.</p>
      </section>
      <section class="uc-section">
        <h2>Uma dica fora de um exercício</h2>
        <details class="uc-hint"><summary>Dica</summary><p>Os estilos de dica também funcionam fora de <code>&lt;uc-exercise&gt;</code>.</p></details>
        <details class="uc-solution"><summary>Solução</summary><p>E os de solução também.</p></details>
      </section>
    </uc-guide>
  </uc-page>
</body>
</html>
