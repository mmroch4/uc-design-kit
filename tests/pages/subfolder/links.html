<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page in a subfolder · test</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
</head>
<body>
  <uc-page current="weeks">
    <h1>Página numa subpasta</h1>
    <p>Os links da navegação e o breadcrumb do guião devem apontar para <code>../</code>,
      porque as páginas em <code>course.js</code> são relativas a <code>course.js</code>.</p>
    <uc-guide week="10">
      <h1>Guião de teste</h1>
      <h2>Secção</h2>
      <p>Conteúdo.</p>
    </uc-guide>
  </uc-page>
  <script>
    // Fails the page check (console.error) when page links do not resolve to ../
    document.addEventListener("uc:ready", () => {
      const nav = document.querySelector('.uc-nav a[href$="uc-deadlines.html"]');
      if (!nav || nav.getAttribute("href") !== "../uc-deadlines.html") {
        console.error("subfolder: nav link not resolved against course.js:", nav && nav.getAttribute("href"));
      }
      // Every relative URL from course.js (HTMLText included) resolves the same way.
      const html = UC.internal.h("span", { html: '<a href="uc-weeks.html#week-2">a</a> <a href="https://example.org/">b</a> <a href="#top">c</a>' });
      // Images too, checked in an inert document so nothing is fetched.
      const inert = document.implementation.createHTMLDocument("").createElement("span");
      inert.innerHTML = '<img src="img/x.png" alt="">';
      UC.internal.resolveCourseLinks(inert);
      const got = [...html.querySelectorAll("[href]"), ...inert.querySelectorAll("[src]")].map((node) => node.getAttribute("href") || node.getAttribute("src"));
      if (got.join(" ") !== "../uc-weeks.html#week-2 https://example.org/ #top ../img/x.png") {
        console.error("subfolder: HTMLText links not resolved against course.js:", got.join(" "));
      }
      if (UC.course.deadlines.find((d) => d.id === "ap1").links[0].url !== "#") console.error("subfolder: '#' link was rewritten");
      if (UC.course.institution.url !== "https://www.dcc.fc.up.pt") console.error("subfolder: absolute URL was rewritten");
      const crumb = document.querySelector('.uc-guide a[href$="#week-10"]');
      if (!crumb || crumb.getAttribute("href") !== "../uc-weeks.html#week-10") {
        console.error("subfolder: breadcrumb not resolved:", crumb && crumb.getAttribute("href"));
      }
    });
  </script>
</body>
</html>
