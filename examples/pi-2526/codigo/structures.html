    <h1>Examples: Structures</h1>
    <div class="uc-content">
<p>Defining structures data types and manipulating arrays of structures:</p>
<uc-code collapsible="" lang="c"><script type="text/plain">
//********************************************
// Contacts list: example of using structures
// Abril 2025
// Fernando Silva
//********************************************

#include <stdio.h>
#include <stdlib.h>
#include <string.h>

#define MAXCONTACTS  1000
#define MAXNAME      100
#define EOL          '\n'
#define SKIPEOL {while (getchar()!='\n') ;}

// new data types
typedef struct {
  char  *name;
  int     tel;
  char *email;
} Contact;

// Global variables
Contact myContacts[MAXCONTACTS]; // array with my contacts list
int nContacts;                    // number of contacts in myContacts list

// prototype functions
void printContact(char *msg, int index);
Contact readContact();
void inputMyContacts();
void addContact(Contact c);
char *readName();
int searchTelephone(int t);

int main() {
  inputMyContacts();
  int flag;
  scanf("%d", &flag);
  if (flag==0) { // search for contact given telephone
    int tel;
    scanf("%d",&tel);
    int index= searchTelephone(tel);
    if (index==-1)
      printf("Telefone %d is not in my contacts\n", tel);
    else
      printContact("Contact found:",index);
  } else if (flag==1) { // add new contact
    Contact c= readContact();
    addContact(c);
    printf("%d\n",nContacts);
  }

}

// print 1 contact
void printContact(char *msg, int index) {
  printf("%s\n", msg);
  printf("Name: %s\n",myContacts[index].name);
  printf("Tel: %d\n", myContacts[index].tel);
  printf("Email: %s\n", myContacts[index].email);
}

// reads a name (line of characters) from standard input
char *readName() {
  char ch, aux[MAXNAME], *name;
  int  ctr= 0;
  while ((ch=getchar())!=EOL)
    aux[ctr++]= ch;
  aux[ctr]= '\0';
  name= (char *) malloc(ctr+1);
  strcpy(name, aux);
  return name;
}
// read 1 contact
Contact readContact() {
  Contact c;
  c.name= readName();
  scanf("%d",&c.tel);
  SKIPEOL;
  c.email= readName();
  return c;
}
// read a set of contacts
void inputMyContacts() {
  scanf("%d", &nContacts);
  SKIPEOL;
  for (int i= 0; i < nContacts; i++)
    myContacts[i]= readContact();
}
//
int searchTelephone(int t) {
  for (int i= 0; i < nContacts; i++)
    if (myContacts[i].tel==t)
      return i;
  return -1;
}
// add 1 new contact if possible
void addContact(Contact c) {
  if (nContacts<MAXCONTACTS) {
    myContacts[nContacts]= c;
    nContacts++;
  }
  else
    printf("Contacts list is full!!!\n");
}
</script></uc-code>
