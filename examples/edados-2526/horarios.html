<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horários e equipa · Estruturas de Dados 2025/26</title>
  <meta name="description" content="Horários das aulas teóricas e práticas de Estruturas de Dados 2025/26, salas, atendimento a estudantes e equipa docente.">
  <link rel="stylesheet" href="../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="theme.css">
  <script src="course.js"></script>
  <script src="../../kit/v1/uc-kit.js" defer></script>
</head>
<body>
  <uc-page current="schedule">
    <header class="uc-page-header">
      <h1>Horários e equipa</h1>
      <p class="uc-prose">Aulas a partir de 16 de setembro de 2025. As práticas são todas no edifício FC6 (DCC).</p>
    </header>

    <!-- Horário: editar em course.js (schedule). Os docentes de cada turma vêm de team[].classes.
         class-filter: cada estudante escolhe a sua turma; a escolha fica guardada no browser. -->
    <uc-timetable class-filter type="lecture lab" heading="Aulas">
      <p>O horário completo também está no <a href="https://sigarra.up.pt/fcup/">SIGARRA</a>.</p>
    </uc-timetable>

    <!-- Equipa docente e atendimento a estudantes: editar em course.js (team, team[].officeHours). -->
    <uc-team view="table" heading="Equipa docente"></uc-team>
  </uc-page>
</body>
</html>
