<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Início · Estruturas de Dados 2025/26</title>
  <meta name="description" content="Estruturas de Dados (CC1007), DCC/FCUP, 2025/26: esta semana, avisos, próximas datas de avaliação e equipa docente.">
  <link rel="stylesheet" href="../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="theme.css">
  <script src="course.js"></script>
  <script src="../../kit/v1/uc-kit.js" defer></script>
</head>
<body>
  <uc-page current="home">
    <!-- Código, título e descrição: vêm de course.js (code, title, tagline). -->
    <uc-hero></uc-hero>

    <!-- Cartão "Esta semana": datas calculadas; matéria lida de semanas.html;
         prazos (quizzes, exercícios, avaliações) de course.js. -->
    <uc-this-week></uc-this-week>

    <div class="uc-split">
      <!-- Avisos: editar em course.js (notices). -->
      <uc-notices></uc-notices>

      <!-- Próximas datas: editar em course.js (deadlines). per-kind="1": só o próximo de cada tipo. -->
      <uc-deadlines per-kind="1">
        <a href="avaliacao.html">Ver regras de avaliação</a>
      </uc-deadlines>
    </div>

    <section class="uc-section" aria-labelledby="atalhos">
      <h2 id="atalhos">Acesso rápido</h2>
      <ul class="uc-shortcuts">
        <li><a href="materiais.html#slides">Slides das teóricas</a></li>
        <li><a href="semanas.html">Guiões das práticas</a></li>
        <li><a href="codigo/index.html">Código das teóricas</a></li>
        <li><a href="horarios.html">Horários e salas</a></li>
      </ul>
    </section>

    <!-- Equipa docente: editar em course.js (team). -->
    <uc-team heading="Equipa docente"></uc-team>
  </uc-page>
</body>
</html>
