    <h1>TAD Vector</h1>
    <section class="uc-section" aria-labelledby="vector">
      <h2 id="vector">Implementação · Vector.java</h2>
      <uc-code lang="java" filename="Vector.java" collapsible>
        <script type="text/plain">
// -----------------------------------------------------------
// Estruturas de Dados 2025/2026 (CC1007) - DCC/FCUP
// http://www.dcc.fc.up.pt/~fds/aulas/EDados/2526/
// -----------------------------------------------------------
// Implementa o TAD Vector
// Ultima alteracao: 10/03/2018
// -----------------------------------------------------------

public class Vector {
   // Atributos
   private double x, y;

   // Construtor
   Vector(double x0, double y0) {
      x = x0;
      y = y0;
   }

   //Conversao de um vector para String
   @Override 
   public String toString() {
      return "(" + x + "," + y + ")";
   }
   
   public Vector add(Vector v) {
      return new Vector(x + v.x, y + v.y);
   }

   public Vector sub(Vector v) {
      return new Vector(x - v.x, y - v.y);
   }

   public double magnitude() {
      return Math.sqrt(x*x + y*y);
   }

   public Vector scale(double c) {
      return new Vector(x*c,y*c);
   } 
}
        </script>
      </uc-code>
    </section>

      <h2 id="testvector">Exemplo de utilização · TestVector.java</h2>

// Estruturas de Dados 2025/2026 (CC1007) - DCC/FCUP

// -----------------------------------------------------------
// Exemplo de utilizacao do TAD Vector
// Ultima alteracao: 10/03/2018
// -----------------------------------------------------------
public class TestVector {
   public static void main(String[] args) {
      Vector v1 = new Vector(3,2);
      Vector v2 = new Vector(1,4);

      Vector v3 = v1.add(v2);
      Vector v4 = v1.sub(v2);
      double  m = v1.magnitude();
      Vector v5 = v1.scale(2);
      
      System.out.println(v3);
      System.out.println(v4);
      System.out.printf("%.2f%n", m);
      System.out.println(v5);      
   }
}
        </script>
