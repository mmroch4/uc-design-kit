<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pre data-copy · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>

</head>
<body>
  <main>
    <!-- The block starts at column 0: spaces inside <pre> are content. -->
<!-- demo:start -->
<div class="uc-content">
  <p>Exemplo de entrada:</p>
  <pre data-copy="Input">5
3 1 4 1 5</pre>
  <p>Saída esperada:</p>
  <pre data-copy="Output">1 1 3 4 5</pre>
</div>
<!-- demo:end -->
  </main>
</body>
</html>
