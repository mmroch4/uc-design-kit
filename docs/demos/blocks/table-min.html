<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-table sem largura mínima · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <main>
    <!-- demo:start -->
    <div class="uc-table" style="--uc-table-min: 0">
      <table>
        <caption class="uc-visually-hidden">Pesos da avaliação</caption>
        <thead>
          <tr><th scope="col">Componente</th><th scope="col">Peso</th></tr>
        </thead>
        <tbody>
          <tr><td>Exame</td><td>60%</td></tr>
          <tr><td>Trabalhos</td><td>20%</td></tr>
          <tr><td>Teste prático</td><td>20%</td></tr>
        </tbody>
      </table>
    </div>
    <!-- demo:end -->
  </main>
</body>
</html>
