<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Componente próprio: pesquisa binária · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="extensions/uc-binary-search.css">
  <link rel="stylesheet" href="../demo.css">
  <script src="../course.js"></script>
  <script>
    // Second language, so ?lang=en shows the component's English texts.
    UC_COURSE.languages = ["pt", "en"];
  </script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="extensions/uc-binary-search.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <main>
    <!-- demo:start -->
    <uc-binary-search values="2 5 8 12 16 23 38 56 72 91" target="23">
      <p>Pesquisa binária de 23 em 2 5 8 12 16 23 38 56 72 91: o meio é 16, depois 56 e depois 23, encontrado em 3 passos.</p>
    </uc-binary-search>
    <!-- demo:end -->
  </main>
</body>
</html>
