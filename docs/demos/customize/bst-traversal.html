<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Componente próprio: percursos numa árvore · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="extensions/uc-bst-traversal.css">
  <link rel="stylesheet" href="../demo.css">
  <script src="../course.js"></script>
  <script>
    // Second language, so ?lang=en shows the component's English texts.
    UC_COURSE.languages = ["pt", "en"];
  </script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="extensions/uc-bst-traversal.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <main>
    <!-- demo:start -->
    <uc-bst-traversal values="5 3 8 1 4 7 9">
      <p>Árvore binária de pesquisa com 5 3 8 1 4 7 9. Pré-ordem: 5 3 1 4 8 7 9. Em-ordem: 1 3 4 5 7 8 9. Pós-ordem: 1 4 3 7 9 8 5. Em largura: 5 3 8 1 4 7 9.</p>
    </uc-bst-traversal>
    <!-- demo:end -->
  </main>
</body>
</html>
