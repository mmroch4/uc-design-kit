<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-widget-union-find · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../../../widgets/v1/uc-widget-union-find.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <main>
    <!-- demo:start -->
    <uc-widget-union-find n="6" algorithms="naive size compression"
        ops="union 0 1; union 1 2; union 2 3; union 3 4; union 4 5; find 0; find 0" editable>
      <p>Uma cadeia de uniões: sem heurísticas a árvore fica com altura 5 (uma lista);
         com união por tamanho fica com altura 1.</p>
    </uc-widget-union-find>
    <!-- demo:end -->
  </main>
</body>
</html>
