<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-date: datas de prazos · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <script src="../course.js"></script>
  <script>
    // Adds a deadline without a date yet to the demo course.
    window.UC_COURSE.deadlines = window.UC_COURSE.deadlines.concat([
      { id: "recurso", title: "Exame de recurso", date: null, kind: "exam" },
    ]);
  </script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <main>
    <!-- demo:start -->
    <ul>
      <li>Trabalho 2: <uc-date deadline="t2" with-time>28 nov</uc-date></li>
      <li>Exame: <uc-date deadline="exame">janeiro</uc-date></li>
      <li>Recurso: <uc-date deadline="recurso">a marcar</uc-date></li>
    </ul>
    <!-- demo:end -->
  </main>
</body>
</html>
