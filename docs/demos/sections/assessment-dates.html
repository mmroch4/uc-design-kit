<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secção: datas e regras de avaliação · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <main>
    <!-- demo:start -->
    <div class="uc-split">
      <uc-deadlines view="table" heading="Datas"></uc-deadlines>
      <section class="uc-section" aria-labelledby="regras">
        <h2 id="regras">Regras</h2>
        <ul class="uc-checklist">
          <li>Os trabalhos são individuais.</li>
          <li>Entregas fora do prazo não são aceites.</li>
          <li>O recurso substitui apenas a nota do exame.</li>
        </ul>
      </section>
    </div>
    <!-- demo:end -->
  </main>
</body>
</html>
