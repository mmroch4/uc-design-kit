<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-event: entre semanas · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <main>
    <!-- demo:start -->
    <uc-weeks no-breaks>
      <uc-week n="11" title="Grafos: pesquisa em largura e em profundidade">
        <dl>
          <dt>Teóricas</dt>
          <dd>Representação de grafos, BFS e DFS</dd>
        </dl>
      </uc-week>
      <uc-week n="12" title="Revisões e teste prático">
        <dl>
          <dt>Teóricas</dt>
          <dd>Revisões da matéria</dd>
        </dl>
      </uc-week>
      <uc-event deadline="exame">
        <span>Inscrição no exame até 5 de janeiro.</span>
      </uc-event>
    </uc-weeks>
    <!-- demo:end -->
  </main>
</body>
</html>
