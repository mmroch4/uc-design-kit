<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-widget-complexity · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../../../widgets/v1/uc-widget-sort.js" defer></script>
  <script src="../../../widgets/v1/uc-widget-complexity.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <main>
    <!-- demo:start -->
    <uc-widget-sort id="insercao" values="5 2 9 1 7 3 8 6" algorithm="insertion" editable controls="compact">
      <p>Ordenação por inserção de 5 2 9 1 7 3 8 6.</p>
    </uc-widget-sort>
    <uc-widget-complexity functions="n nlogn n2" max="16" for="insercao" points="4:6">
      <p>Comparações da ordenação por inserção comparadas com n, n log n e n².</p>
    </uc-widget-complexity>
    <!-- demo:end -->
  </main>
</body>
</html>
