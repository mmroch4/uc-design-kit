<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-widget-bst · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../../../widgets/v1/uc-widget-bst.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <main>
    <!-- demo:start -->
    <uc-widget-bst values="50 30 70 20 40 60 80" ops="insert 45; search 60; remove 30; min">
      <p>Árvore com raiz 50. Inserir 45 (fica à direita de 40), procurar 60 (encontrado),
        remover 30 (o sucessor 40 ocupa o seu lugar), mínimo: 20.</p>
    </uc-widget-bst>
    <!-- demo:end -->
  </main>
</body>
</html>
