<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-weeks: prazo durante a interrupção · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <script src="../course.js"></script>
  <script>
    // Adds a quiz dated during the study week, to show where <uc-weeks> places it.
    window.UC_COURSE.deadlines.push({ id: "quiz3", title: "Quiz 3: complexidade", date: "2025-10-29", end: "2025-10-31", kind: "quiz", note: "Online, na plataforma de entregas" });
  </script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <main>
    <!-- demo:start -->
    <uc-weeks>
      <uc-week n="6" title="Complexidade e notação O">
        <dl>
          <dt>Teóricas</dt>
          <dd>Contar operações, melhor e pior caso</dd>
        </dl>
      </uc-week>
      <uc-week n="7" title="Recursão">
        <dl>
          <dt>Teóricas</dt>
          <dd>Caso base e chamada recursiva</dd>
        </dl>
      </uc-week>
    </uc-weeks>
    <!-- demo:end -->
  </main>
</body>
</html>
