<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-weeks: interrupção entre semanas · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <main>
    <!-- demo:start -->
    <uc-weeks>
      <uc-week n="5" title="Listas e cadeias de caracteres">
        <dl>
          <dt>Teóricas</dt>
          <dd>Listas, índices e fatias</dd>
        </dl>
      </uc-week>
      <uc-week n="6" title="Complexidade e notação O">
        <dl>
          <dt>Teóricas</dt>
          <dd>Contar operações, melhor e pior caso</dd>
        </dl>
      </uc-week>
      <uc-week n="7" title="Recursão">
        <dl>
          <dt>Teóricas</dt>
          <dd>Caso base e chamada recursiva</dd>
        </dl>
      </uc-week>
      <uc-week n="8" title="Ordenação simples: seleção e inserção">
        <dl>
          <dt>Teóricas</dt>
          <dd>Ordenação por seleção e por inserção</dd>
        </dl>
      </uc-week>
    </uc-weeks>
    <!-- demo:end -->
  </main>
</body>
</html>
