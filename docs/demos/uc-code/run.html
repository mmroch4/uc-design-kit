<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-code: executar JavaScript · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <main>
    <!-- demo:start -->
    <uc-code lang="js" filename="fibonacci.js" editable run>
      <script type="text/plain">
        // The first ten Fibonacci numbers.
        const fib = [0, 1];
        while (fib.length < 10) {
          fib.push(fib[fib.length - 1] + fib[fib.length - 2]);
        }
        console.log(fib.join(" "));
      </script>
    </uc-code>
    <!-- demo:end -->
  </main>
</body>
