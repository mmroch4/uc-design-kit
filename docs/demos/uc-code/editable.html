<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-code: código editável · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <main>
    <!-- demo:start -->
    <uc-code lang="js" filename="swap.js" editable>
      <script type="text/plain">
        // Swaps the elements at positions i and j of list.
        function swap(list, i, j) {
          const tmp = list[i];
          list[i] = list[j];
          list[j] = tmp;
        }
      </script>
    </uc-code>
    <!-- demo:end -->
  </main>
</body>
</html>
