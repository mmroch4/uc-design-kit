<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-widget-list editável · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../../../widgets/v1/uc-widget-list.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <main>
    <!-- demo:start -->
    <uc-widget-list values="4 2 7" ops="search 7; remove-last; add-last 6" predict editable>
      <p>Procurar 7 (posição 2), remover o último e adicionar 6 no fim: 4 → 2 → 6.</p>
    </uc-widget-list>
    <!-- demo:end -->
  </main>
</body>
</html>
