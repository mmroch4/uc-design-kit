<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-widget-list · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../../../widgets/v1/uc-widget-list.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <main>
    <!-- demo:start -->
    <uc-widget-list values="3 8 5" ops="add-first 1; insert 2 4; remove 8; reverse">
      <p>Lista 3 → 8 → 5. Depois de adicionar 1 no início, inserir 4 na posição 2,
        remover 8 e inverter: 5 → 4 → 3 → 1.</p>
    </uc-widget-list>
    <!-- demo:end -->
  </main>
</body>
</html>
