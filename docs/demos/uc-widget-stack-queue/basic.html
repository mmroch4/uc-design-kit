<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-widget-stack-queue · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../../../widgets/v1/uc-widget-stack-queue.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <main>
    <!-- demo:start -->
    <uc-widget-stack-queue algorithm="queue" capacity="4" values="3 8 5"
                           ops="dequeue; enqueue 1; enqueue 9; enqueue 7; dequeue">
      <p>Fila circular de capacidade 4 com 3 8 5. Sai 3, entram 1 e 9 (o 9 vai para a
        posição 0), 7 não cabe, sai 8. Fica 5 1 9.</p>
    </uc-widget-stack-queue>
    <!-- demo:end -->
  </main>
</body>
</html>
