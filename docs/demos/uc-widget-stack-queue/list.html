<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-widget-stack-queue em lista ligada · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../../../widgets/v1/uc-widget-stack-queue.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <main>
    <!-- demo:start -->
    <uc-widget-stack-queue algorithm="stack" impl="list" values="3 8" ops="push 5; pop; peek; pop; pop; pop" editable>
      <p>Pilha 3 8 (8 no topo). push 5, pop devolve 5, peek devolve 8, depois saem 8 e 3
        e o último pop encontra a pilha vazia.</p>
    </uc-widget-stack-queue>
    <!-- demo:end -->
  </main>
</body>
</html>
