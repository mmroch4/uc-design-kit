<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-page: mudar de língua · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <style>
    /* The page shell is the whole demo: no demo padding, and no full-viewport height inside the frame. */
    body { padding: 0; }
    uc-page { min-height: 0; }
  </style>
  <script src="../course.js"></script>
  <script>
    // This demo is bilingual: it adds English to the demo course; ?lang=en shows the English version.
    window.UC_COURSE.languages = ["pt", "en"];
    window.UC_COURSE.title = { pt: "Algoritmos e Programação", en: "Algorithms and Programming" };
    window.UC_COURSE.tagline = {
      pt: "Um curso fictício usado nas demonstrações da documentação do UC Design Kit.",
      en: "A fictional course used in the demos of the UC Design Kit documentation.",
    };
  </script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <!-- demo:start -->
  <uc-page>
    <uc-hero></uc-hero>
    <p lang="pt">Este parágrafo só aparece em português.</p>
    <p lang="en">This paragraph only appears in English.</p>
  </uc-page>
  <!-- demo:end -->
</body>
</html>
