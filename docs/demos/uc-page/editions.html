<!doctype html>
<html lang="pt">
<head>

  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">

  <style>

    uc-page { min-height: 0; }

    UC_COURSE.editions = "uc-page/editions.js";
  </script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <!-- demo:start -->
  <uc-page updated="2025-07-15">
    <uc-hero></uc-hero>
    <p>Página da edição 2024/25: o aviso no topo leva à edição atual e "Outros anos", no cabeçalho, às restantes.</p>
  </uc-page>
  <!-- demo:end -->
