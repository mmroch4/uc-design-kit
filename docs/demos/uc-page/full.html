<!doctype html>
<html lang="pt">
<head>

  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">

  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>

<body>
  <!-- demo:start -->
  <uc-page layout="full">
    <h1>Enunciado do trabalho 2</h1>
    <p>Sem navegação: o conteúdo ocupa toda a largura, entre o cabeçalho e o rodapé.</p>
  </uc-page>
  <!-- demo:end -->
</body>
</html>
