<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-page: painel lateral · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <style>
    /* The page shell is the whole demo: no demo padding, and no full-viewport height inside the frame. */
    body { padding: 0; }
    uc-page { min-height: 0; }
  </style>
  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <!-- demo:start -->
  <uc-page layout="panel" current="about">
    <h1>Sobre a UC</h1>
    <p>Não há faixa de cabeçalho: o nome da cadeira, a pesquisa, a navegação e, no fundo, o horário das teóricas e o atendimento ficam numa barra de altura total à esquerda, que não se mexe quando a página desliza. Em ecrãs estreitos, volta o cabeçalho com o botão "Menu".</p>
  </uc-page>
  <!-- demo:end -->
</body>
</html>
