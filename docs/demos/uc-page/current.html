<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-page: item ativo escolhido · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <style>
    /* The page shell is the whole demo: no demo padding, and no full-viewport height inside the frame. */
    body { padding: 0; }
    uc-page { min-height: 0; }
  </style>
  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <!-- demo:start -->
  <uc-page current="weeks">
    <h1>Guião 10: inserir e procurar numa árvore</h1>
    <p>Este guião não está na navegação, mas "Semanas" fica ativo porque a página tem <code>current="weeks"</code>.</p>
  </uc-page>
  <!-- demo:end -->
</body>
</html>
