<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-page: faixa institucional · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <style>
    /* The page shell is the whole demo: no demo padding, and no full-viewport height inside the frame. */
    body { padding: 0; }
    uc-page { min-height: 0; }
  </style>
  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <!-- demo:start -->
  <uc-page layout="banner" current="home">
    <uc-hero></uc-hero>
    <p>O cabeçalho, a apresentação da cadeira e a navegação ficam numa faixa da cor do curso. Num ecrã largo, as páginas são separadores no fundo da faixa; em ecrãs estreitos, o botão "Menu" fica dentro dela.</p>
  </uc-page>
  <!-- demo:end -->
</body>
</html>
