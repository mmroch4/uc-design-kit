<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-page: centrado · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <style>
    /* The page shell is the whole demo: no demo padding, and no full-viewport height inside the frame. */
    body { padding: 0; }
    uc-page { min-height: 0; }
  </style>
  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <!-- demo:start -->
  <uc-page layout="centered" current="about">
    <h1>Sobre a UC</h1>
    <p>O cabeçalho e a navegação ficam centrados, com o título da cadeira em letra grande, e o conteúdo ocupa uma coluna de leitura estreita. A pesquisa e as línguas ficam no canto; em ecrãs estreitos, o botão "Menu" fica centrado por cima do conteúdo.</p>
  </uc-page>
  <!-- demo:end -->
</body>
</html>
