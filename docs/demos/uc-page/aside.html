<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-page: blocos laterais · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <style>
    /* The page shell is the whole demo: no demo padding, and no full-viewport height inside the frame. */
    body { padding: 0; }
    uc-page { min-height: 0; }
  </style>
  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <!-- demo:start -->
  <uc-page layout="aside" current="about">
    <h1>Sobre a UC</h1>
    <p>Como no Moodle: a navegação à esquerda, o conteúdo ao centro e, à direita, em todas as páginas, os blocos de <code>aside</code> do <code>course.js</code> (por omissão, as próximas datas e os avisos). Abaixo de 1200 px os blocos passam para baixo do conteúdo.</p>
  </uc-page>
  <!-- demo:end -->
</body>
</html>
