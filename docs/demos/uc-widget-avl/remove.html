<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-widget-avl: remoção · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../../../widgets/v1/uc-widget-avl.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <main>
    <!-- demo:start -->
    <uc-widget-avl values="50 30 70 20 40 60 80 10" ops="remove 60; remove 80; remove 30">
      <p>Remover 60 e 80 desequilibra 50: rotação à direita, 30 passa a raiz.
        Remover 30 põe no seu lugar o sucessor, 40.</p>
    </uc-widget-avl>
    <!-- demo:end -->
  </main>
</body>
