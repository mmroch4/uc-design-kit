<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-widget-graph · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <script src="../course.js"></script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../../../widgets/v1/uc-widget-graph.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <main>
    <!-- demo:start -->
    <uc-widget-graph source="A" algorithms="bfs dfs components" predict>
      <pre data-input>
A B
A C
B D
C D
D E
F G
      </pre>
      <p>BFS a partir de A: A 0, B 1, C 1, D 2, E 3; F e G ficam a ∞.
        DFS: A B D C E. Duas componentes: {A, B, C, D, E} e {F, G}.</p>
    </uc-widget-graph>
    <!-- demo:end -->
  </main>
</body>
</html>
