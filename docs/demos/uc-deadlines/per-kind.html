<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uc-deadlines: um de cada tipo · Demonstração · UC Design Kit</title>
  <link rel="stylesheet" href="../../../kit/v1/uc-kit.css">
  <link rel="stylesheet" href="../demo.css">
  <script src="../course.js"></script>
  <script>
    // More deadlines than the shared course: a past one, two quizzes open for a week, one to be scheduled.
    window.UC_COURSE.deadlines = window.UC_COURSE.deadlines.concat([
      { id: "t1", title: "Entrega do trabalho 1", date: "2025-10-31", time: "23:59", kind: "submission", links: [{ label: "Notas", url: "#" }] },
      { id: "quiz4", title: "Quiz 4", date: "2025-11-24", end: "2025-11-30", kind: "quiz", note: "Na plataforma de entregas", url: "#" },
      { id: "quiz5", title: "Quiz 5", date: "2025-12-01", end: "2025-12-07", kind: "quiz", note: "Na plataforma de entregas" },
      { id: "recurso", title: "Exame de recurso", date: null, kind: "exam" },
    ]);
  </script>
  <script src="../../../kit/v1/uc-kit.js" defer></script>
  <script src="../demo.js" defer></script>
</head>
<body>
  <main>
    <!-- demo:start -->
    <uc-deadlines per-kind="1"></uc-deadlines>
    <!-- demo:end -->
    <noscript><p>Esta demonstração precisa de JavaScript: os prazos vêm do <code>course.js</code>.</p></noscript>
  </main>
</body>
</html>
